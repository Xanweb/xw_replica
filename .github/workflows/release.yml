name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag is not on main"
            exit 1
          fi
      - name: Tag must point to the triggering commit
        run: |
          if [ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" != "$GITHUB_SHA" ]; then
            echo "tag does not point to the triggering commit"
            exit 1
          fi
      - name: Tag must match pkgVersion
        run: python3 .github/scripts/check_version.py "$GITHUB_REF_NAME" controller.php
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/release_notes.py "$VERSION" CHANGELOG.md > notes.md
      - name: Export and check package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/export_package.py "$GITHUB_SHA" "dist/xw_replica-$VERSION.zip"
          python3 .github/scripts/check_package.py "dist/xw_replica-$VERSION.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/xw_replica-$VERSION.zip" \
            --title "Replica $VERSION" --notes-file notes.md --verify-tag
